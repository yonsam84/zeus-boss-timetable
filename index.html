<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제우스 보스 타임테이블</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0f0e0c; --row:#1d1a13; --line:#2e2a20;
  --text:#ece6d6; --sub:#9a917d; --dim:#6b6455;
  --gold:#d9b25f; --gold-dim:#8a7342;
  --red:#e0614f; --red-bg:#3a1712;
  --amber:#f0a83a; --amber-bg:#3a2810;
  --green:#7bc47f; --blue:#7aa7e0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.4}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:8px 0 16px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;letter-spacing:-.02em;color:var(--gold)}
.today{font-size:14px;color:var(--sub);margin-top:4px}
.today b{color:var(--text);font-weight:600}
.clock{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;letter-spacing:-.02em}
.clock small{font-size:12px;color:var(--dim);font-weight:500;margin-left:4px}
.conn{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:12px;color:var(--dim)}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.conn.ok .dot{background:var(--green)} .conn.ok{color:var(--sub)}
.conn.err .dot{background:var(--red)} .conn.err{color:var(--red)}
.loading{color:var(--dim);font-size:14px;padding:40px 0;text-align:center}
.toast.err{background:#3a1712;border-color:var(--red)}
.guide{margin:10px 0 0;padding:10px 12px;background:var(--row);border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--sub)}
.guide b{color:var(--text)}
.guide .ex{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.guide code{font-family:inherit;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;background:#0c0b09;border:1px solid var(--line);border-radius:4px;padding:0 6px}
.summary{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--row);border:1px solid var(--line);color:var(--sub)}
.chip b{color:var(--text)}
.chip.warn{border-color:var(--amber);color:var(--amber)} .chip.warn b{color:var(--amber)}
.chip.live{border-color:var(--red);color:var(--red)} .chip.live b{color:var(--red)}

section{margin-top:22px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px;font-weight:700;color:var(--sub)}
.sec-h .cnt{color:var(--dim);font-weight:500}
.sec-h.warn{color:var(--amber)} .sec-h.live{color:var(--red)}
.sec-h .date{color:var(--dim);font-weight:500}
.empty{color:var(--dim);font-size:13px;padding:10px 12px}

.row{display:grid;grid-template-columns:110px 1fr 200px;gap:12px;align-items:center;padding:8px 12px;background:var(--row);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;transition:background .6s}
.row.st-check{border-color:#5a4520;background:var(--amber-bg)}
.row.st-live{border-color:#6b2a20;background:var(--red-bg)}
.row.flash{background:#2c3a22}
.time .hm{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.time .rel{display:block;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.st-live .time .hm{color:var(--red)} .st-live .time .rel{color:#f2a196}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.badge.check{background:var(--amber);color:#1a1205}
.badge.live{background:var(--red);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.55}}
.name{font-weight:700;font-size:16px}
.lv{font-size:12px;color:var(--gold);font-weight:600;margin-left:4px}
.meta{font-size:12px;color:var(--sub);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--sub)}
.tag.fixed{border-color:var(--gold-dim);color:var(--gold)}
.tag.inter{border-color:#3b4f6e;color:var(--blue)}
.upd{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}

.act{display:flex;flex-direction:column;gap:2px}
.inrow{display:flex;gap:6px}
.inrow input{flex:1;min-width:0;height:24px;padding:0 6px;background:#0c0b09;border:1px solid var(--line);border-radius:5px;color:var(--text);font:inherit;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.inrow input::placeholder{letter-spacing:0;color:var(--dim)}
.inrow input:focus{outline:none;border-color:var(--gold-dim)}
.inrow input.bad{border-color:var(--red)}
.inrow input.ok{border-color:var(--green)}
.inrow button{height:24px;padding:0 10px;border:0;border-radius:5px;background:var(--gold);color:#1a1205;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.inrow button:disabled{background:#3a3428;color:var(--dim);cursor:not-allowed}
.msg{font-size:12px;line-height:1.3;color:var(--dim)}
.msg:empty{display:none}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}
.auto{font-size:12px;color:var(--dim);text-align:right}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#26301f;border:1px solid var(--green);color:var(--text);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:720px){
  .row{grid-template-columns:84px 1fr;gap:8px 10px}
  .act{grid-column:2 / -1;max-width:220px}
  .auto{text-align:left}
  .time .hm{font-size:19px}
  .clock{font-size:22px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>제우스 보스 타임테이블</h1>
      <div class="today" id="today"></div>
    </div>
    <div class="clock" id="clock"></div>
  </header>
  <div class="conn" id="conn"><span class="dot"></span><span id="connText">연결 중…</span></div>
  <div class="guide">
    <b>입력 방법</b> · 게임 콘텐츠 현황판의 <b>"○시간 ○분 후 출현"</b>을 숫자로 붙여서 입력 → 저장
    <div class="ex">
      <span>7시간 12분 → <code>712</code></span>
      <span>10시간 55분 → <code>1055</code></span>
      <span>1시간 → <code>100</code></span>
      <span>45분 → <code>45</code></span>
    </div>
  </div>
  <div class="summary" id="summary"></div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import { getFirestore, collection, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

/* ===== Firebase 설정 (공개용 식별값 — 보안은 Firestore 규칙이 담당) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAA5kicIf_gEufCGOtAgjTagEsANEMEMuU",
  authDomain: "zeus-boss-1b1c4.firebaseapp.com",
  projectId: "zeus-boss-1b1c4",
  storageBucket: "zeus-boss-1b1c4.firebasestorage.app",
  messagingSenderId: "854583435935",
  appId: "1:854583435935:web:d21869c129f64644f378aa"
};
const db = getFirestore(initializeApp(firebaseConfig));

/* ===== 시간 유틸 (기기 시간대와 무관하게 KST 고정) ===== */
const KST = 9 * 3600e3, MIN = 60e3, HOUR = 3600e3, DAY = 86400e3;
const DOW = ['일','월','화','수','목','금','토'];
const kp = ms => { const d = new Date(ms + KST); return { y:d.getUTCFullYear(), mo:d.getUTCMonth()+1, d:d.getUTCDate(), h:d.getUTCHours(), mi:d.getUTCMinutes(), s:d.getUTCSeconds(), dow:d.getUTCDay() }; };
const dayStart = ms => { const d = new Date(ms + KST); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - KST; };
const p2 = n => String(n).padStart(2,'0');
const hm = ms => { const k = kp(ms); return `${p2(k.h)}:${p2(k.mi)}`; };
const fmtMin = m => { const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h}시간 ${r}분` : `${h}시간`) : `${r}분`; };
const until = ms => fmtMin(Math.max(0, Math.ceil(ms / MIN)));   // 남은 시간: 올림 (게임 표기와 맞춤)
const since = ms => fmtMin(Math.max(0, Math.floor(ms / MIN)));  // 경과 시간: 내림
const dateLabel = ms => { const k = kp(ms); return `${k.mo}/${k.d} (${DOW[k.dow]})`; };

/* ===== 보스 마스터 ===== */
const BOSSES = [
  {id:'krys',  name:'크리소파고스', lv:35, region:'테살리아', loc:'테살리아 평원',      type:'timer', period:8},
  {id:'amor',  name:'아모르포스',   lv:35, region:'테살리아', loc:'침식된 경작지',      type:'timer', period:8},
  {id:'tras',  name:'트라손',       lv:40, region:'테살리아', loc:'고대 신전 유적지',   type:'timer', period:8},
  {id:'ioc',   name:'이오칸토스',   lv:45, region:'테살리아', loc:'아르보리아스 폐허',  type:'timer', period:12},
  {id:'kini',  name:'키니 러우리',  lv:45, region:'테살리아', loc:'금지된 숲',          type:'timer', period:12},
  {id:'arach', name:'아라크네',     lv:50, region:'테살리아', loc:'',                   type:'fixed', sched:[{dow:[3], times:['21:00']}]},
  {id:'alas',  name:'알라스토르',   lv:55, region:'자하브',   loc:'무법자의 길목',      type:'timer', period:8},
  {id:'bedix', name:'베딕스',       lv:60, region:'자하브',   loc:'공헌의 제단',        type:'timer', period:8},
  {id:'goat',  name:'고트시스',     lv:60, region:'자하브',   loc:'황금 리라 부락',     type:'timer', period:8},
  {id:'tri',   name:'트리포크',     lv:65, region:'자하브',   loc:'가시 덤불 지대',     type:'timer', period:12},
  {id:'giant', name:'거인의 세번째 손', lv:70, region:'자하브', loc:'유적지 폐허',     type:'timer', period:12},
  {id:'argos', name:'아르고스',     lv:65, region:'자하브',   loc:'',                   type:'fixed', sched:[{dow:[1], times:['21:00']}]},
  {id:'samor', name:'봉인된 아모르포스', lv:40, region:'타르타로스 1계', loc:'유폐의 동지', inter:true, type:'timer', period:8},
  {id:'bdel',  name:'봉인된 브델레스',   lv:45, region:'타르타로스 2계', loc:'배신의 심연굴', type:'timer', period:24},
  {id:'medea', name:'메데이아',     lv:45, region:'타르타로스 2계', loc:'', inter:true, type:'fixed', sched:[{dow:[2], times:['21:00']}]},
  {id:'chim',  name:'키메라',       lv:60, region:'타르타로스 4계', loc:'', inter:true, type:'fixed', sched:[{dow:[6], times:['21:00']}]},
  {id:'cerb',  name:'케르베로스',   lv:75, region:'타르타로스 5계', loc:'', inter:true, type:'fixed', sched:[{dow:[5], times:['21:00']}]},
  {id:'scoto', name:'스코톨라스마 (선봉+함락)', lv:40, region:'테살리아 침공', loc:'2마리 동시 공략', type:'fixed', sched:[{dow:[1,4], times:['21:00']}]},
  {id:'abyss', name:'심연의 틈',    lv:null, region:'테살리아·자하브 침공', loc:'', type:'fixed', sched:[{dow:[0,1,2,3,4,5,6], times:['00:00','12:00','18:00']}]},
];
const FIXED_GRACE = 5 * MIN; // 고정 보스: 출현 후 5분 지나면 자동 처치 처리

/* ===== 데이터 저장소: Firestore 'spawns' 컬렉션, 실시간 구독 =====
   spawns/{bossId} = { at: 다음 출현 시각(ms), upd: 입력한 시각(ms) } */
const store = {
  subscribe(fn){
    onSnapshot(collection(db, 'spawns'),
      snap => { const m = {}; snap.forEach(d => { m[d.id] = d.data(); }); setConn('ok'); fn(m); },
      err  => { console.error(err); setConn('err', '연결 실패 — 새로고침해 주세요'); });
  },
  setSpawn(id, at, upd){ return setDoc(doc(db, 'spawns', id), {at, upd}); },
};
function setConn(state, text){
  const el = document.getElementById('conn');
  el.className = 'conn ' + state;
  document.getElementById('connText').textContent = text || (state === 'ok' ? '실시간 공유 중 · 다른 길드원 입력이 자동 반영됩니다' : '연결 중…');
}
window.addEventListener('offline', () => setConn('err', '오프라인 — 인터넷 연결을 확인하세요'));
window.addEventListener('online',  () => setConn('ok'));

/* ===== 입력 검증: 남은 시간 → 다음 출현 시각
   1~2자리 = 분, 3~4자리 = 앞자리 시 + 끝 2자리 분. 리스폰 주기 초과 불가 ===== */
function parseRemain(raw, b, now){
  const s = raw.trim();
  if (!s) return {empty:true};
  if (!/^\d+$/.test(s)) return {err:'숫자만 입력하세요 (예: 712)'};
  if (s.length > 4) return {err:'최대 4자리 (예: 1055)'};
  const h = s.length <= 2 ? 0 : +s.slice(0, -2), m = +s.slice(-2);
  if (m > 59) return {err:'분은 00~59 사이'};
  const total = h*60 + m;
  if (total > b.period*60) return {err:`이 보스는 최대 ${b.period}시간 (리스폰 주기)`};
  return {mins: total, at: now + total*MIN};
}

/* ===== 타임라인 계산 ===== */
function buildItems(now, spawns){
  const todayS = dayStart(now), endS = todayS + 2*DAY;
  const items = [];
  for (const b of BOSSES){
    if (b.type === 'timer'){
      const sp = spawns[b.id];
      if (!sp){ items.push({b, key:b.id, status:'check'}); continue; }
      items.push({b, key:b.id, at:sp.at, upd:sp.upd, status: now >= sp.at ? 'live' : 'wait'});
    } else {
      for (let d = 0; d < 2; d++){
        const ds = todayS + d*DAY, dow = kp(ds).dow;
        for (const s of b.sched){
          if (!s.dow.includes(dow)) continue;
          for (const tm of s.times){
            const [h,m] = tm.split(':').map(Number), at = ds + h*HOUR + m*MIN;
            if (now >= at + FIXED_GRACE || at >= endS) continue;
            items.push({b, key:`${b.id}@${at}`, at, status: now >= at ? 'live' : 'wait'});
          }
        }
      }
    }
  }
  return items;
}

/* ===== 렌더 ===== */
const drafts = {};
let flashKey = null, flashUntil = 0, lastSpawns = null; // null = 아직 불러오기 전
const $list = document.getElementById('list');

function fixedLabel(b){
  return b.sched.map(s => (s.dow.length === 7 ? '매일' : s.dow.map(d => DOW[d]).join('·')) + ' ' + s.times.join('·')).join(', ');
}
function updLabel(upd, now){
  return `${dayStart(upd) !== dayStart(now) ? dateLabel(upd) + ' ' : ''}${hm(upd)} 입력`;
}

function rowHTML(it, now){
  const b = it.b, isTimer = b.type === 'timer';
  let time;
  if (it.status === 'check') time = `<span class="badge check">확인필요</span><span class="rel">남은 시간 미입력</span>`;
  else if (it.status === 'live') time = `<span class="hm">${hm(it.at)}</span><span class="rel">출현 ${since(now - it.at)} 경과</span>`;
  else time = `<span class="hm">${hm(it.at)}</span><span class="rel">${until(it.at - now)} 후</span>`;

  const meta = [
    `<span>${b.region}${b.loc ? ' · ' + b.loc : ''}</span>`,
    isTimer ? `<span class="tag">${b.period}h</span>` : `<span class="tag fixed">고정 ${fixedLabel(b)}</span>`,
    b.inter ? `<span class="tag inter">인터</span>` : '',
    it.status === 'live' ? `<span class="badge live">출현중</span>` : '',
    isTimer && it.upd ? `<span class="upd">${updLabel(it.upd, now)}</span>` : '',
  ].join('');

  let act;
  if (isTimer){
    const v = drafts[b.id] || '';
    act = `<div class="act"><div class="inrow">
        <input inputmode="numeric" maxlength="4" placeholder="남은 시간 (예: 712)" data-id="${b.id}" value="${v}" autocomplete="off">
        <button data-save="${b.id}" disabled>저장</button></div>
        <div class="msg" data-msg="${b.id}"></div></div>`;
  } else {
    act = `<div class="act auto">${it.status === 'live' ? `${until(it.at + FIXED_GRACE - now)} 후 자동 처치 처리` : '입력 불필요 (자동)'}</div>`;
  }
  const flash = it.key === flashKey && now < flashUntil ? ' flash' : '';
  return `<div class="row st-${it.status}${flash}" data-key="${it.key}">
    <div class="time">${time}</div>
    <div class="boss"><div class="name">${b.name}${b.lv ? `<span class="lv">Lv.${b.lv}</span>` : ''}</div><div class="meta">${meta}</div></div>
    ${act}</div>`;
}

function section(title, cls, items, now, extra = ''){
  return `<section><div class="sec-h ${cls}">${title}${extra}<span class="cnt">${items.length}</span></div>
    ${items.length ? items.map(i => rowHTML(i, now)).join('') : '<div class="empty">없음</div>'}</section>`;
}

function render(){
  const now = Date.now(), k = kp(now);
  document.getElementById('today').innerHTML = `<b>${k.y}.${p2(k.mo)}.${p2(k.d)} (${DOW[k.dow]})</b> · 기준 시간대 KST`;
  tickClock();
  if (lastSpawns === null){ $list.innerHTML = '<div class="loading">보스 정보를 불러오는 중…</div>'; return; }

  const items = buildItems(now, lastSpawns);
  const tomS = dayStart(now) + DAY;
  const check = items.filter(i => i.status === 'check');
  const live  = items.filter(i => i.status === 'live').sort((a,b) => a.at - b.at);
  const wait  = items.filter(i => i.status === 'wait').sort((a,b) => a.at - b.at);
  const today = wait.filter(i => i.at < tomS), tom = wait.filter(i => i.at >= tomS);

  document.getElementById('summary').innerHTML =
    `<span class="chip warn">확인필요 <b>${check.length}</b></span><span class="chip live">출현중 <b>${live.length}</b></span>` +
    `<span class="chip">오늘 남은 출현 <b>${today.length}</b></span><span class="chip">내일 <b>${tom.length}</b></span>`;

  const ae = document.activeElement, focusId = ae && ae.dataset ? ae.dataset.id : null, sel = focusId ? ae.selectionStart : null;

  $list.innerHTML =
    section('확인필요', 'warn', check, now, ' <span class="cnt">— 게임 현황판의 남은 시간을 입력해 보정하세요</span>') +
    section('출현중', 'live', live, now) +
    section('오늘', '', today, now, ` <span class="date">${dateLabel(dayStart(now))}</span>`) +
    section('내일', '', tom, now, ` <span class="date">${dateLabel(tomS)}</span>`);

  $list.querySelectorAll('input[data-id]').forEach(el => validate(el, now));
  if (focusId){ const el = $list.querySelector(`input[data-id="${focusId}"]`); if (el){ el.focus(); try{ el.setSelectionRange(sel, sel); }catch(e){} } }
}

function validate(el, now = Date.now()){
  const id = el.dataset.id, b = BOSSES.find(x => x.id === id);
  const btn = $list.querySelector(`button[data-save="${id}"]`), msg = $list.querySelector(`[data-msg="${id}"]`);
  const r = parseRemain(el.value, b, now);
  el.classList.remove('bad','ok'); msg.className = 'msg';
  if (r.empty){ btn.disabled = true; msg.textContent = ''; return r; }
  if (r.err){ btn.disabled = true; el.classList.add('bad'); msg.classList.add('err'); msg.textContent = r.err; return r; }
  btn.disabled = false; el.classList.add('ok'); msg.classList.add('ok');
  msg.textContent = r.mins === 0 ? '지금 출현 → 출현중으로 표시'
    : `${fmtMin(r.mins)} 후 → ${dayStart(r.at) !== dayStart(now) ? '내일 ' : ''}${hm(r.at)} 출현`;
  return r;
}

async function save(id){
  const el = $list.querySelector(`input[data-id="${id}"]`);
  const now = Date.now(), r = validate(el, now);
  if (!r || r.at == null) return;
  const b = BOSSES.find(x => x.id === id);
  const btn = $list.querySelector(`button[data-save="${id}"]`);
  if (saving.has(id)) return;              // 중복 탭 방지
  saving.add(id); btn.disabled = true; btn.textContent = '저장 중';
  try {
    await store.setSpawn(id, r.at, now);
    delete drafts[id];
    if (document.activeElement) document.activeElement.blur();
    flashKey = id; flashUntil = Date.now() + 1500;
    toast(`${b.name} 저장 · ${hm(r.at)} 출현`);
    render(); lastListRender = Date.now();
  } catch (e) {
    console.error(e);
    toast('저장 실패 — 기기 시간이 맞는지 확인 후 다시 시도하세요', true);
    btn.textContent = '저장'; btn.disabled = false;
  } finally {
    saving.delete(id);
  }
}
const saving = new Set();

let toastT;
function toast(t, isErr){ const el = document.getElementById('toast'); el.textContent = t; el.classList.toggle('err', !!isErr); el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), isErr ? 4000 : 2200); }

$list.addEventListener('input', e => { const el = e.target; if (!el.dataset.id) return; el.value = el.value.replace(/\D/g,'').slice(0,4); drafts[el.dataset.id] = el.value; validate(el); });
$list.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.id){ const btn = $list.querySelector(`button[data-save="${e.target.dataset.id}"]`); if (!btn.disabled) save(e.target.dataset.id); } });
$list.addEventListener('click', e => { const id = e.target.dataset && e.target.dataset.save; if (id && !e.target.disabled) save(id); });

// 시계는 1초, 리스트는 15초마다(정각 분 포함) 갱신. 입력·버튼 조작 중에는 리스트 갱신 보류
function tickClock(){ const k = kp(Date.now()); document.getElementById('clock').innerHTML = `${p2(k.h)}:${p2(k.mi)}:${p2(k.s)}<small>KST</small>`; }
let lastListRender = 0;
function maybeRender(){
  tickClock();
  const busy = $list.contains(document.activeElement) && document.activeElement !== document.body;
  if (!busy && (Date.now() - lastListRender > 15000 || kp(Date.now()).s === 0)){ render(); lastListRender = Date.now(); }
}
store.subscribe(s => { lastSpawns = s; render(); lastListRender = Date.now(); });
setInterval(maybeRender, 1000);
</script>
